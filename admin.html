<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - عيادة د. منى المصري</title>
<style>
:root {
  --main: #1a237e; --main-light: #3949ab; --bg: #f4f7f6; --white: #ffffff;
  --text: #333333; --text-light: #666666; --success: #2e7d32; --warning: #ff9800;
  --danger: #f44336; --whatsapp: #25d366;
  --shadow: 0 4px 16px rgba(0,0,0,0.06); --shadow-hover: 0 8px 24px rgba(0,0,0,0.1);
  --radius: 14px; --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
* { box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; overflow-x:hidden; margin-right: 220px; color: var(--text); }
.side-nav { position: fixed; top: 0; right: 0; width: 220px; height: 100vh; background: linear-gradient(180deg, var(--main), var(--main-light)); padding: 25px 15px; display: flex; flex-direction: column; gap: 15px; z-index: 999; }
.side-nav .logo { color: #fff; text-align: center; margin-bottom: 20px; font-size: 18px; font-weight: bold; }
.side-nav a.active { background: var(--white); color: var(--main); font-weight: bold; }
.side-nav a.disabled { opacity: 0.5; pointer-events: none; }
.side-nav a { text-decoration: none; color: #fff; padding: 12px; border-radius: 10px; transition: var(--transition); font-size: 15px; }
.side-nav a:hover { background: rgba(255,255,255,0.15); transform: translateX(-5px); }
.admin-grid { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
.card { background: var(--white); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px; }
.days-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; padding: 10px 0; align-items: start; }

/* Day Card */
.day-col { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; transition: all var(--transition); display: flex; flex-direction: column; }
.day-col:hover { box-shadow: var(--shadow-hover); transform: translateY(-3px); }
.day-col.collapsed { box-shadow: none; transform: none; background: transparent; }

/* Header */
.day-head { background: linear-gradient(135deg, var(--main), var(--main-light)); color: white; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 15px; position: relative; user-select: none; }
.head-actions { display: flex; gap: 8px; align-items: center; }
.head-btn { cursor: pointer; background: rgba(255,255,255,0.2); width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 14px; }
.head-btn:hover { background: rgba(255,255,255,0.35); transform: scale(1.05); }
.head-btn.del:hover { background: var(--danger); }
.head-btn.add:hover { background: #43a047; }

/* Body */
.day-body { padding: 14px; background: var(--white); transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1), padding 0.3s ease, opacity 0.3s ease; max-height: 1500px; opacity: 1; }
.day-col.collapsed .day-body { max-height: 0; padding: 0 14px; opacity: 0; overflow: hidden; }

/* Money Badge */
.day-money { background: #fff8e1; color: var(--warning); padding: 10px; text-align: center; font-weight: 600; border-radius: 10px; margin-bottom: 14px; font-size: 14px; border: 1px solid #ffe082; }

/* Slots */
.slot-item { padding: 11px 12px; margin-bottom: 8px; background: #f8f9fa; border-radius: 10px; cursor: pointer; border-right: 4px solid transparent; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.slot-item:hover { background: #e8eaf6; transform: translateX(-4px); }
.slot-item.booked { border-right-color: var(--success); background: #f1f8e9; }
.slot-item.cancel { border-right-color: var(--danger); background: #ffebee; opacity: 0.8; }
.slot-time { font-weight: 600; color: var(--main); font-size: 15px; }
.slot-name { flex: 1; margin: 0 8px; font-size: 14px; color: var(--text); min-width: 100px; }
.slot-name.saved-patient { color: #2e7d32 !important; font-weight: 600; }
.slot-name.saved-patient::before { content: "💾 "; font-size: 12px; }
.status-badge { font-size: 11px; padding: 3px 7px; border-radius: 6px; font-weight: 500; background: #e3f2fd; color: #1976d2; }
.status-booked { background: #e8f5e9; color: var(--success); }
.status-cancel { background: #ffebee; color: var(--danger); }

/* Action Buttons */
.action-buttons { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; width: 100%; justify-content: flex-end; }
.action-buttons button { background: var(--whatsapp); color: white; border: none; padding: 5px 9px; border-radius: 6px; font-size: 11px; cursor: pointer; transition: 0.2s; font-weight: 500; }
.action-buttons button:nth-child(2) { background: var(--warning); }
.action-buttons button:nth-child(3) { background: var(--danger); }
.action-buttons button:nth-child(4) { background: #6a1b9a; }
.action-buttons button:hover { filter: brightness(1.1); transform: scale(1.05); }

.total-box { background: #c8e6c9; padding: 10px; margin-bottom: 15px; text-align: center; font-weight: bold; border-radius: 10px; color: var(--success); border: 1px solid #a5d6a7; }
input, textarea, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
.btn { background: var(--main); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; margin-top:5px; transition: 0.2s; }
.btn:hover { background: var(--main-light); }

/* Modal & Notif */
.modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(26,35,126,0.85); z-index:10000; display:flex; justify-content:center; align-items:center; cursor:pointer; }
.modal-content { background: var(--white); width:95%; max-width:450px; max-height:90vh; border-radius:16px; padding:20px 25px; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,0.3); position: relative; cursor: default; border-top: 4px solid var(--main); }
.modal-close { position: absolute; top: 12px; left: 12px; width: 32px; height: 32px; border-radius: 50%; background: var(--danger); color: #fff; border: none; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
.modal-title { color: var(--main); text-align: center; margin: 0 0 15px; font-size: 18px; font-weight: 600; }
.modal-slot { padding: 12px; margin: 6px 0; background: var(--bg); border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
.modal-slot.selected { border-color: var(--main); background: #e8eaf6; }
.manual-section { background: #fff3e0; padding: 12px; border-radius: 10px; margin: 15px 0; border: 2px solid var(--warning); }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; }
.modal-btn-primary { background: var(--main); color: #fff; }
.modal-btn-cancel { background: var(--danger); color: #fff; }
.admin-notif { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,var(--success),#43a047); color:#fff; padding:14px 24px; border-radius:12px; font-weight:500; box-shadow:0 10px 30px rgba(0,0,0,0.2); z-index:10001; animation:slideIn 0.3s ease, fadeOut 0.3s ease 4.7s forwards; }
@keyframes slideIn { from { transform:translateX(-50%) translateY(-30px); opacity:0; } to { transform:translateX(-50%) translateY(0); opacity:1; } }
@keyframes fadeOut { from { opacity:1; } to { opacity:0; } }

/* Patients Tab */
#patientsTab { display: none; margin-top: 20px; }
.patient-card { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-right: 4px solid var(--main); }
.session-item { background: #f8f9fa; padding: 10px; border-radius: 8px; margin: 5px 0; }
</style>
</head>
<body>

<div class="side-nav">
  <h2 class="logo">🏥 د. منى المصري</h2>
  <a href="admin.html" class="active">🏠 لوحة التحكم</a>
  <a href="index-admin.html">📂 إدارة المحتوى</a>
  <a href="patients.html">📋 ملفات المرضى</a>
  <button onclick="logout()" class="btn" style="margin-top:auto;">🚪 خروج</button>
</div>

<a href="index.html" style="position:fixed;top:20px;left:20px;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--main),var(--main-light));padding:12px 18px;border-radius:10px;font-size:15px;z-index:9999;box-shadow:0 8px 20px rgba(0,0,0,0.2);">🌐 الموقع الرئيسي</a>

<div class="total-box" id="globalTotal">💰 إجمالي العيادة: 0</div>

<div class="admin-grid">
  <div class="side-panel">
    <div class="card">
      <h3>👤 بيانات الحجز</h3>
      <p id="targetTime">اختر ميعاداً</p>
      <input id="pName" placeholder="الاسم">
      <div id="historyBox" style="background:#e3f2fd;padding:8px;border-radius:8px;margin-top:5px;font-size:13px;display:none;"></div>
      <select id="availableSlots"><option value="">اختر ميعاد متاح</option></select>
      <input type="date" id="requestDate" onchange="loadAvailableSlots(this.value)">
      <input id="pPhone" placeholder="الهاتف">
      <textarea id="pNotes" placeholder="ملاحظات"></textarea>
      <input id="pPaid" type="number" placeholder="المبلغ">
      <select id="pStatus"><option value="حجز">حجز</option><option value="كشف">كشف</option><option value="ملغي">ملغي</option></select>
      <button class="btn" onclick="updateSlot()">حفظ</button>
      <button class="btn" style="background:#00897b" onclick="generateQR()">QR</button>
      <img id="qrImg" width="120" style="display:none;margin-top:10px;">
      <button class="btn" onclick="assignRequest()">تحديد ميعاد للطلب</button>
      <input id="search" placeholder="بحث..." onkeyup="safeLoad()">
      <select id="filter" onchange="safeLoad()"><option value="all">الكل</option><option value="booked">محجوز</option><option value="free">متاح</option></select>
    </div>
  </div>
  <div class="main-panel">
    <div class="card">
      <h3>📅 إضافة يوم</h3>
      <input type="date" id="slotDate">
      <input type="time" id="startTime" value="17:00">
      <input type="time" id="endTime" value="22:00">
      <label>مدة كل ميعاد (بالدقايق)</label>
      <input type="number" id="slotDuration" value="30">
      <button class="btn" onclick="createDaySlots()">توليد</button>
    </div>
    <div id="daysGrid" class="days-row"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, getDoc, updateDoc, addDoc, deleteDoc, query, where, getDocs, writeBatch, serverTimestamp, orderBy, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ================= 🔥 Firebase Config - عيادة د. منى المصري ================= */
const firebaseConfig = {
  apiKey: "AIzaSyD7B-e65xKC2Q3rY6F0TI55QtYJPqqw4dE",
  authDomain: "dr-mona-elmasry.firebaseapp.com",
  databaseURL: "https://dr-mona-elmasry-default-rtdb.firebaseio.com",
  projectId: "dr-mona-elmasry",
  storageBucket: "dr-mona-elmasry.firebasestorage.app",
  messagingSenderId: "40312173388",
  appId: "1:40312173388:web:d5b75d750ac4b5599195e9",
  measurementId: "G-MFG6HP7585"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
window.db = db;

/* ================= ⚙️ إعدادات عامة ================= */
const $ = (id) => document.getElementById(id);
let cache = [], activeId = null, editSession = {}, collapsedDays = {};
const slotsRef = collection(db, "slots");
const requestsRef = collection(db, "requests");
const patientsRef = collection(db, "patients");

/* ================= 🔐 التحقق من الأدمن ================= */
const ADMIN_EMAIL = "admin@clinic.com";
onAuthStateChanged(auth, (user) => {
  if (!user || user.email !== ADMIN_EMAIL) {
    alert("⚠️ يرجى تسجيل الدخول بحساب الأدمن");
    window.location.href = "login.html";
  }
});

window.logout = () => signOut(auth).then(() => location.href = "login.html");

/* ================= 📥 تحميل المواعيد لحظياً ================= */
onSnapshot(slotsRef, (snap) => {
  cache = [];
  snap.forEach(d => cache.push({ id: d.id, ...d.data() }));
  renderSlots();
});

/* ================= 🎯 دوال الحجز الأساسية ================= */
window.selectSlot = async (id) => {
  activeId = id;
  const snap = await getDoc(doc(db, "slots", id));
  if (!snap.exists()) return;
  const d = snap.data();
  $("pName").value = d.patient?.name || "";
  $("pPhone").value = d.patient?.phone || "";
  $("pNotes").value = d.patient?.notes || "";
  $("pPaid").value = d.paid || 0;
  $("pStatus").value = d.status || "حجز";
  $("targetTime").innerText = d.date + " - " + d.time;
};

window.updateSlot = async () => {
  if (!activeId) return alert("اختاري ميعاداً أولاً");
  await updateDoc(doc(db, "slots", activeId), {
    booked: $("pName").value.trim() !== "",
    status: $("pStatus").value,
    paid: Number($("pPaid").value || 0),
    patient: {
      name: $("pName").value,
      phone: $("pPhone").value,
      notes: $("pNotes").value
    },
    updatedAt: serverTimestamp()
  });
  activeId = null;
  showAdminNotification("✅ تم التعديل");
};

window.createDaySlots = async () => {
  const date = $("slotDate").value, start = $("startTime").value, end = $("endTime").value;
  const duration = Number($("slotDuration").value);
  if (!date || !start || !end) return alert("اكمل البيانات");
  let time = new Date(date + "T" + start), endTime = new Date(date + "T" + end), count = 0;
  while (time < endTime) {
    await addDoc(slotsRef, {
      date: String(date),
      time: time.toTimeString().slice(0,5),
      booked: false,
      status: "available",
      patient: null,
      paid: 0,
      notes: "",
      createdAt: serverTimestamp()
    });
    time.setMinutes(time.getMinutes() + duration);
    count++;
  }
  showAdminNotification("✅ تم إنشاء " + count + " ميعاد ليوم " + date);
};

window.deleteDay = async (date) => {
  if (!confirm("حذف اليوم؟")) return;
  const q = query(slotsRef, where("date", "==", date));
  const snap = await getDocs(q);
  const batch = writeBatch(db);
  snap.forEach(d => batch.delete(d.ref));
  await batch.commit();
  showAdminNotification("✅ تم حذف اليوم");
};

window.generateQR = () => {
  const qrImg = $("qrImg");
  if (!activeId) return alert("⚠️ اختر ميعاداً أولاً");
  const name = $("pName").value || "بدون اسم", phone = $("pPhone").value || "";
  const timeInfo = $("targetTime").innerText;
  qrImg.src = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + encodeURIComponent("عيادة د. منى المصري\nمريض: " + name + "\nتليفون: " + phone + "\nموعد: " + timeInfo);
  qrImg.style.display = "block";
};

window.openWhatsApp = (phone) => {
  if (!phone) return alert("⚠️ لا يوجد رقم مسجل");
  let wa = phone.replace(/^0+/,"").replace(/\s+/g,"");
  if (!wa.startsWith("20")) wa = "20" + wa;
  window.open("https://wa.me/" + wa + "?text=" + encodeURIComponent("مرحباً د/ منى، بخصوص موعد المريض..."), "_blank");
};

/* ================= 💾 دوال حفظ المرضى (الجديدة) ================= */

// 💾 حفظ مريض من ميعاد محجوز
window.savePatientFromSlot = async (slotId) => {
  const slot = cache.find(s => s.id === slotId);
  if (!slot || !slot.patient?.phone) return alert("⚠️ لا توجد بيانات مريض");
  
  const phone = cleanPhone(slot.patient.phone);
  
  try {
    // البحث عن المريض
    const q = query(patientsRef, where("phone", "==", phone));
    const snap = await getDocs(q);
    
    let patientId;
    
    if (snap.empty) {
      // إنشاء ملف جديد
      const newPatient = {
        name: slot.patient.name,
        phone: phone,
        created_at: serverTimestamp(),
        updated_at: serverTimestamp(),
        sessions: [{
          date: slot.date,
          time: slot.time,
          notes: slot.patient.notes || "",
          slot_id: slotId
        }]
      };
      const docRef = await addDoc(patientsRef, newPatient);
      patientId = docRef.id;
      showAdminNotification("✅ تم إنشاء ملف لـ " + slot.patient.name);
    } else {
      // إضافة جلسة لمريض موجود
      patientId = snap.docs[0].id;
      await updateDoc(doc(db, "patients", patientId), {
        sessions: arrayUnion({
          date: slot.date,
          time: slot.time,
          notes: slot.patient.notes || "",
          slot_id: slotId
        }),
        updated_at: serverTimestamp()
      });
      showAdminNotification("✅ أضيفت جلسة لـ " + slot.patient.name);
    }
    
    // ربط الحجز بآيدي المريض
    await updateDoc(doc(db, "slots", slotId), {
      patient_id: patientId,
      is_saved_patient: true
    });
    
    renderSlots();
    
  } catch (err) {
    console.error("❌ Save patient error:", err);
    alert("❌ خطأ: " + err.message);
  }
};

// 🔍 تنظيف رقم الهاتف
function cleanPhone(phone) {
  const p = phone.replace(/^0+/, '').replace(/\s/g, '');
  return p.startsWith('20') ? p : '20' + p;
}

// 🎨 هل المريض محفوظ؟
function isSavedPatient(phone) {
  const clean = cleanPhone(phone);
  return cache.some(s => s.patient?.phone && cleanPhone(s.patient.phone) === clean && s.is_saved_patient);
}

/* ================= 🎨 عرض المواعيد (محدث) ================= */
window.renderSlots = function() {
  const grid = $("daysGrid"), totalBox = $("globalTotal");
  let days = {}, total = 0;
  
  cache.forEach(d => {
    if (!d.date) return;
    if (!days[d.date]) days[d.date] = [];
    days[d.date].push(d);
  });
  
  grid.innerHTML = "";
  grid.style.alignItems = "start";

  Object.keys(days).sort().forEach(date => {
    let dayTotal = 0;
    days[date].forEach(s => {
      if (s.status === "كشف") {
        dayTotal += Number(s.paid||0);
        total += Number(s.paid||0);
      }
    });
    
    const col = document.createElement("div");
    col.className = "day-col";
    col.id = "day-" + date;
    if (collapsedDays[date]) col.classList.add("collapsed");

    const slotsHTML = days[date].sort((a,b)=>a.time.localeCompare(b.time)).map(x => {
      const isBooked = x.booked && x.status !== "cancelled";
      const pname = x.patient?.name || "بدون اسم", phone = x.patient?.phone || "";
      const statusLabel = x.status==="cancelled"?"❌ ملغي":(isBooked?"✅ محجوز":"⭕ متاح");
      const badgeClass = x.status==="cancelled"?"status-cancel":(isBooked?"status-booked":"status-available");
      
      // 🎨 علامة المريض المحفوظ
      const isSaved = x.is_saved_patient || isSavedPatient(phone);
      const nameClass = isSaved ? "saved-patient" : "";
      const savedBadge = isSaved ? '<span style="margin-right:5px;color:#2e7d32;font-size:12px;" title="مريض محفوظ">💾</span>' : "";
      
      // 🔘 أزرار الإجراءات
      let actions = "";
      if (isBooked) {
        actions = `<div class='action-buttons'>
          <button onclick='event.stopPropagation();openWhatsApp("${phone}")'>💬 واتساب</button>
          ${isSaved ? 
            `<button onclick='event.stopPropagation();window.location.href="patients.html?phone=${phone}"' style='background:#6a1b9a'>📋 الملف</button>` : 
            `<button onclick='event.stopPropagation();savePatientFromSlot("${x.id}")' style='background:#2e7d32'>💾 حفظ</button>`
          }
          <button onclick='event.stopPropagation();cancelSlot("${x.id}")'>🗑️ إلغاء</button>
        </div>`;
      }
      
      return `<div class='slot-item ${isBooked?'booked':(x.status==='cancelled'?'cancel':'')}' onclick='selectSlot("${x.id}")'>
        <span class='slot-time'>${x.time}</span>
        <span class='slot-name ${nameClass}'>${savedBadge}${pname}</span>
        <span class='status-badge ${badgeClass}'>${statusLabel}</span>
        ${actions}
      </div>`;
    }).join("");

    col.innerHTML = `<div class='day-head'><span>📅 ${date}</span><div class='head-actions'>
      <span class='head-btn add' onclick='event.stopPropagation(); addSlotToDate("${date}")' title='إضافة ميعاد'>+</span>
      <span class='head-btn' onclick='event.stopPropagation(); toggleDay("${date}")' title='طي/فرد'>${collapsedDays[date] ? "▲" : "▼"}</span>
      <span class='head-btn del' onclick='event.stopPropagation(); deleteDay("${date}")' title='حذف'>✕</span>
    </div></div><div class='day-body' id='body-${date}'><div class='day-money'>💰 ${dayTotal} جنيه</div>${slotsHTML}</div>`;
    grid.appendChild(col);
  });
  
  totalBox.innerText = "💰 إجمالي العيادة: " + total + " جنيه";
};

window.toggleDay = function(date) {
  const col = document.getElementById("day-" + date);
  if (collapsedDays[date]) { collapsedDays[date] = false; col.classList.remove("collapsed"); }
  else { collapsedDays[date] = true; col.classList.add("collapsed"); }
  renderSlots();
};

window.cancelSlot = async (slotId) => {
  const slot = cache.find(s => s.id === slotId);
  if (!slot || !slot.booked) return alert("⚠️ اختر ميعاداً محجوزاً");
  const patient = slot.patient;
  if (!confirm("⚠️ تأكيد الإلغاء:\n" + slot.date + " " + slot.time + "\n" + (patient?.name||"") + "\n\nمتأكد؟")) return;
  try {
    await updateDoc(doc(db, "slots", slotId), {
      booked: false,
      status: "cancelled",
      patient: null,
      paid: 0,
      cancelledAt: serverTimestamp()
    });
    showAdminNotification("✅ تم الإلغاء");
  } catch (err) {
    alert("❌ خطأ: " + err.message);
  }
};

window.addSlotToDate = async (date) => {
  const time = prompt("📅 أدخل وقت الميعاد الجديد ليوم " + date + "\n(الصيغة: ساعة:دقيقة مثل 14:30)");
  if (!time) return;
  if (!/^\d{2}:\d{2}$/.test(time)) return alert("⚠️ الصيغة غير صحيحة. استخدم HH:MM مثل 15:30");
  const exists = cache.some(s => s.date === date && s.time === time);
  if (exists) return alert("⚠️ هذا الوقت موجود بالفعل في هذا اليوم");
  try {
    await addDoc(slotsRef, {
      date, time, booked: false, status: "available", patient: null, paid: 0,
      notes: "تمت إضافته يدوياً", isManual: true,
      createdAt: serverTimestamp(), updatedAt: serverTimestamp()
    });
    showAdminNotification("✅ تم إضافة الميعاد " + time + " ليوم " + date);
  } catch (err) { alert("❌ فشل الإضافة: " + err.message); }
};

/* ================= 🔍 بحث وفلترة ================= */
window.safeLoad = () => {
  const searchTerm = $("search").value.toLowerCase(), filterValue = $("filter").value;
  const filtered = cache.filter(slot => {
    const matchSearch = !searchTerm || slot.patient?.name?.toLowerCase().includes(searchTerm) || slot.time.includes(searchTerm);
    let matchFilter = true;
    if (filterValue === "booked") matchFilter = slot.booked === true;
    else if (filterValue === "free") matchFilter = slot.booked === false;
    return matchSearch && matchFilter;
  });
  
  const grid = $("daysGrid");
  grid.innerHTML = "";
  let days = {};
  filtered.forEach(d => {
    if (!d.date) return;
    if (!days[d.date]) days[d.date] = [];
    days[d.date].push(d);
  });
  
  Object.keys(days).sort().forEach(date => {
    let dayTotal = 0;
    days[date].forEach(s => { if (s.status === "كشف") dayTotal += Number(s.paid||0); });
    
    const col = document.createElement("div");
    col.className = "day-col";
    col.innerHTML = `<div class='day-head'>${date}</div><div class='day-money'>💰 ${dayTotal} جنيه</div>` +
      days[date].map(x => `<div class='slot-item ${x.booked?"booked":""}' onclick='selectSlot("${x.id}")'><b>${x.time}</b> - ${x.patient?.name||"متاح"}</div>`).join("");
    grid.appendChild(col);
  });
};

/* ================= 📋 دوال إضافية ================= */
function showAdminNotification(message) {
  const notif = document.createElement("div");
  notif.className = "admin-notif";
  notif.innerHTML = "🔔 " + message;
  document.body.appendChild(notif);
  setTimeout(() => notif.remove(), 5000);
}

window.loadAvailableSlots = function(date) {
  const select = $("availableSlots");
  if (!select || !date) return;
  select.innerHTML = "<option value=''>⏳ جاري التحميل...</option>";
  select.disabled = true;
  
  const daySlots = cache.filter(s => s.date === date);
  const available = daySlots.filter(s => !s.booked && s.status !== "cancelled");
  
  if (available.length > 0) {
    available.sort((a,b) => a.time.localeCompare(b.time));
    select.innerHTML = "<option value=''>-- اختر ميعاد متاح --</option>";
    available.forEach(slot => {
      const opt = document.createElement("option");
      opt.value = slot.id;
      opt.textContent = "🕒 " + slot.time + " - متاح";
      select.appendChild(opt);
    });
    select.disabled = false;
  } else {
    select.innerHTML = "<option value='__MANUAL__' selected>⏰ أدخل وقت يدوي</option>";
    select.disabled = false;
  }
};

console.log("✅ Admin Loaded - Dr. Mona Clinic");
</script>
